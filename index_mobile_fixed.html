<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>攒钱计划｜2026.08 - 2027.01</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#111827;
      --green:#10b981;
      --red:#ef4444;
      --blue:#2563eb;
      --soft:#eef2ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      background:linear-gradient(180deg,#f7f8fc 0%,#eef2f7 100%);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{max-width:980px;margin:0 auto;padding:22px 16px 48px}
    .hero{
      background:linear-gradient(135deg,#111827,#334155);
      color:#fff;
      border-radius:24px;
      padding:24px;
      box-shadow:0 18px 45px rgba(17,24,39,.18);
      margin-bottom:18px;
    }
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
    .hero h1{margin:0;font-size:26px}
    .hero p{margin:8px 0 0;color:#cbd5e1;font-size:14px}
    .goal{font-size:13px;color:#cbd5e1;text-align:right}
    .goal strong{display:block;color:#fff;font-size:28px;margin-top:2px}
    .progress-box{margin-top:22px}
    .progress-info{display:flex;justify-content:space-between;font-size:13px;color:#dbeafe;margin-bottom:8px}
    .progress{
      height:12px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden
    }
    .progress > div{
      height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#34d399);
      border-radius:999px;transition:.35s ease
    }
    .grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px
    }
    .stat,.card{
      background:var(--card);border:1px solid rgba(229,231,235,.8);
      box-shadow:0 8px 24px rgba(15,23,42,.05);border-radius:18px
    }
    .stat{padding:18px}
    .stat .label{font-size:13px;color:var(--muted);margin-bottom:7px}
    .stat .num{font-size:24px;font-weight:800;letter-spacing:-.5px}
    .income{color:var(--green)}
    .expense{color:var(--red)}
    .balance{color:var(--blue)}
    .card{padding:18px;margin-bottom:18px}
    .card h2{font-size:18px;margin:0 0 14px}
    .form{
      display:grid;grid-template-columns:1.1fr .9fr .9fr 1.4fr auto;gap:10px;align-items:end
    }
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
    input,select,button{
      width:100%;height:44px;border-radius:12px;border:1px solid var(--line);
      font-size:15px;background:#fff
    }
    input,select{padding:0 12px;outline:none}
    input:focus,select:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.16)}
    button{border:0;background:var(--primary);color:#fff;padding:0 16px;font-weight:700;cursor:pointer}
    button:active{transform:translateY(1px)}
    .months{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
    .month{
      background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:13px
    }
    .month b{display:block;font-size:13px;margin-bottom:7px}
    .month .mnum{font-size:18px;font-weight:800}
    .month small{display:block;color:var(--muted);margin-top:5px}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:660px}
    th,td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
    th{font-size:12px;color:var(--muted);font-weight:600}
    .badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
    .badge.in{background:#ecfdf5;color:#059669}
    .badge.out{background:#fef2f2;color:#dc2626}
    .del{
      background:#fff;color:#dc2626;border:1px solid #fecaca;height:32px;width:auto;padding:0 10px;font-size:12px
    }
    .empty{text-align:center;color:var(--muted);padding:24px}
    .footer-note{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
    .ghost{background:#fff;color:#374151;border:1px solid var(--line);width:auto;height:36px;font-size:12px}
    @media (max-width:760px){
      .wrap{padding:14px 12px 32px}
      .hero{padding:20px;border-radius:20px}
      .hero h1{font-size:22px}
      .grid{grid-template-columns:1fr}

      /* 手机端：表单全部改为单列，避免日期和类型挤在一起 */
      .form{
        grid-template-columns:1fr;
        gap:14px;
      }
      .form > div{
        min-width:0;
        width:100%;
      }
      .form .wide,
      .form .submit{
        grid-column:auto;
      }
      .form input,
      .form select,
      .form button{
        width:100%;
        max-width:100%;
        min-width:0;
      }
      .form input[type="date"]{
        display:block;
        -webkit-appearance:none;
        appearance:none;
      }

      .months{grid-template-columns:repeat(2,1fr)}
      .goal{text-align:left}
    }
  </style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="hero-top">
      <div>
        <h1>我的攒钱计划</h1>
        <p>2026年8月 ～ 2027年1月 · 目标存下 15,000 元</p>
      </div>
      <div class="goal">目标金额<strong>¥15,000</strong></div>
    </div>
    <div class="progress-box">
      <div class="progress-info">
        <span id="progressText">已完成 0%</span>
        <span id="remainText">还差 ¥15,000</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </section>

  <section class="grid">
    <div class="stat">
      <div class="label">累计收入</div>
      <div class="num income" id="incomeTotal">¥0.00</div>
    </div>
    <div class="stat">
      <div class="label">累计支出</div>
      <div class="num expense" id="expenseTotal">¥0.00</div>
    </div>
    <div class="stat">
      <div class="label">当前总金额</div>
      <div class="num balance" id="balanceTotal">¥0.00</div>
    </div>
  </section>

  <section class="card">
    <h2>添加一笔记录</h2>
    <form class="form" id="recordForm">
      <div>
        <label>日期</label>
        <input type="date" id="date" min="2026-08-01" max="2027-01-31" required>
      </div>
      <div>
        <label>类型</label>
        <select id="type">
          <option value="income">收入</option>
          <option value="expense">支出</option>
        </select>
      </div>
      <div>
        <label>金额（元）</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="例如 500" required>
      </div>
      <div class="wide">
        <label>备注</label>
        <input type="text" id="note" maxlength="30" placeholder="工资、吃饭、购物等">
      </div>
      <div class="submit">
        <button type="submit">添加</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>每月净存金额</h2>
    <div class="months" id="months"></div>
  </section>

  <section class="card">
    <h2>收支明细</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>类型</th>
            <th>金额</th>
            <th>备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="ghost" id="clearBtn" type="button">清空全部记录</button>
    </div>
  </section>

  <div class="footer-note">数据只保存在当前浏览器本地，不会自动上传到服务器。</div>
</div>

<script>
  const GOAL = 15000;
  const STORAGE_KEY = 'saving_records_2026_2027_v1';
  const monthKeys = ['2026-08','2026-09','2026-10','2026-11','2026-12','2027-01'];
  const monthLabels = ['2026年8月','2026年9月','2026年10月','2026年11月','2026年12月','2027年1月'];

  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

  const fmt = n => '¥' + Number(n).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    render();
  }

  function render(){
    const income = records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
    const expense = records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
    const balance = income - expense;

    document.getElementById('incomeTotal').textContent = fmt(income);
    document.getElementById('expenseTotal').textContent = fmt(expense);
    document.getElementById('balanceTotal').textContent = fmt(balance);

    const pct = Math.max(0, Math.min(100, balance / GOAL * 100));
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = '已完成 ' + pct.toFixed(1) + '%';
    document.getElementById('remainText').textContent =
      balance >= GOAL ? '已达到目标 🎉' : '还差 ' + fmt(GOAL - balance);

    const monthsEl = document.getElementById('months');
    monthsEl.innerHTML = monthKeys.map((key,i)=>{
      const arr = records.filter(r=>r.date.startsWith(key));
      const ins = arr.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
      const outs = arr.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
      const net = ins-outs;
      return `<div class="month">
        <b>${monthLabels[i]}</b>
        <div class="mnum">${fmt(net)}</div>
        <small>收入 ${fmt(ins)} · 支出 ${fmt(outs)}</small>
      </div>`;
    }).join('');

    const body = document.getElementById('recordsBody');
    const sorted = [...records].sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
    if(!sorted.length){
      body.innerHTML = `<tr><td colspan="5" class="empty">还没有记录，先添加第一笔收入或支出吧。</td></tr>`;
    } else {
      body.innerHTML = sorted.map(r=>`
        <tr>
          <td>${r.date}</td>
          <td><span class="badge ${r.type==='income'?'in':'out'}">${r.type==='income'?'收入':'支出'}</span></td>
          <td class="${r.type==='income'?'income':'expense'}">${r.type==='income'?'+':'-'}${fmt(r.amount)}</td>
          <td>${escapeHtml(r.note || '-')}</td>
          <td><button class="del" onclick="removeRecord(${r.id})">删除</button></td>
        </tr>
      `).join('');
    }
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function removeRecord(id){
    records = records.filter(r=>r.id!==id);
    save();
  }

  document.getElementById('recordForm').addEventListener('submit', e=>{
    e.preventDefault();
    const date = document.getElementById('date').value;
    const type = document.getElementById('type').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const note = document.getElementById('note').value.trim();

    if(!date || isNaN(amount) || amount <= 0) return;
    if(date < '2026-08-01' || date > '2027-01-31'){
      alert('日期请选择 2026年8月1日 到 2027年1月31日。');
      return;
    }

    records.push({
      id: Date.now(),
      date,
      type,
      amount,
      note
    });
    save();
    e.target.reset();
    document.getElementById('date').value = date;
  });

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if(confirm('确定要清空全部收支记录吗？此操作不能恢复。')){
      records = [];
      save();
    }
  });

  const today = new Date();
  const iso = today.toISOString().slice(0,10);
  document.getElementById('date').value =
    iso >= '2026-08-01' && iso <= '2027-01-31' ? iso : '2026-08-01';

  render();
</script>
</body>
</html>
